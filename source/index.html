<script>
'use strict';
// Engine/craft snapshot generated by tools/new-riso.mjs. Edit this HTML for this work.
// Donors: prints/workings (baked print), studies/index (live tone/motion), tools/lib/visual-kit.
// Re-run the generator only to create a NEW file. This source owns all subsequent art edits.
const CSS=720, W=1080, OUT=1080, K=1, PITCH=4.6, DUR=1200;
const PAPER = '#F2EDE3';
const INK = {
  blue:   '#0078BF',
  pink:   '#FF48B0',
  yellow: '#FFE800',
  green:  '#00A95C',
  orange: '#FF6C2F',
  violet: '#765BA7',
  indigo: '#2E3192',
};

/* Screen angles as rational tangents (b/a). A rotated dot grid only repeats
   seamlessly on a rational tangent, so these are the real angles rather than
   the nominal 15/45/75 — any other value leaves a visible seam where the
   pattern tile wraps. */
const SCREEN = {
  blue:   { a: 4, b: 1 },   // 14.0°
  pink:   { a: 1, b: 4 },   // 76.0°
  yellow: { a: 1, b: 0 },   //  0.0°
  green:  { a: 1, b: 1 },   // 45.0°
  orange: { a: 2, b: 1 },   // 26.6°
  violet: { a: 1, b: 2 },   // 63.4°
  indigo: { a: 1, b: 1 },   // 45.0°
};

/* Registration: each plate misses by a fixed amount, in device px. */
const REG = {
  blue:   [ 1.5, -1.0], pink:   [-2.5,  2.0], yellow: [ 2.0,  1.5],
  green:  [-1.5, -1.5], orange: [ 1.0,  2.0], violet: [-2.0, -1.0],
  indigo: [ 0.0,  0.0],
};

const CX = W / 2, CY = W / 2;

/* ── deterministic randomness ─────────────────────────────────────────────── */

function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const rngFor = (key) => mulberry32(hash(key));

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;

function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/* ── halftone screens ─────────────────────────────────────────────────────────
   For screen angle tanθ = b/a the dot lattice is generated by the orthogonal
   vectors P/√(a²+b²)·(a,b) and P/√(a²+b²)·(−b,a). That lattice contains
   (P√(a²+b²), 0), so a square tile of side S = P√(a²+b²) repeats seamlessly and
   holds exactly a²+b² dots.

   Screens are anchored to canvas space, never to the object being drawn. A
   screen that rides along with its subject makes the texture crawl, which is
   the single most recognisable way this look goes wrong.                     */

const screens = {};

function buildScreen(name) {
  const { a, b } = SCREEN[name];
  const n = a * a + b * b;
  const S = Math.max(2, Math.round(PITCH * Math.sqrt(n)));
  const P = S / Math.sqrt(n);              // effective pitch after rounding
  const u = P / Math.sqrt(n);
  const v1 = [u * a, u * b], v2 = [-u * b, u * a];

  // Lattice points reduced into the tile, plus wrapped neighbours so dots that
  // straddle an edge are drawn on both sides.
  const pts = [];
  for (let m = -n; m <= n; m++) {
    for (let k = -n; k <= n; k++) {
      const x = m * v1[0] + k * v2[0], y = m * v1[1] + k * v2[1];
      const wx = ((x % S) + S) % S, wy = ((y % S) + S) % S;
      if (!pts.some(p => Math.abs(p[0] - wx) < 0.01 && Math.abs(p[1] - wy) < 0.01)) pts.push([wx, wy]);
    }
  }
  const wrapped = [];
  for (const [x, y] of pts) for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) wrapped.push([x + dx, y + dy]);

  // Threshold tile: a pixel takes ink when coverage exceeds π·d²/P², which is
  // the coverage at which a dot of radius d would reach that pixel.
  const th = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      let d2 = Infinity;
      for (const [px, py] of wrapped) {
        const dx = x + 0.5 - px, dy = y + 0.5 - py, q = dx * dx + dy * dy;
        if (q < d2) d2 = q;
      }
      th[y * S + x] = clamp(Math.PI * d2 / (P * P), 0, 1);
    }
  }
  return { S, P, pts, wrapped, th, patterns: new Map() };
}

function screenOf(name) {
  return screens[name] || (screens[name] = buildScreen(name));
}

/** Screen a greyscale coverage canvas into hard dots. Bake-time only. */
function screenCoverage(covCanvas, name) {
  const sc = screenOf(name);
  const w = covCanvas.width, h = covCanvas.height;
  const src = covCanvas.getContext('2d').getImageData(0, 0, w, h);
  const s = src.data;
  for (let y = 0; y < h; y++) {
    const row = (y % sc.S) * sc.S;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const cover = s[i + 3] / 255;
      s[i + 3] = cover > sc.th[row + (x % sc.S)] ? 255 : 0;
    }
  }
  const out = cv(w, h);
  out.getContext('2d').putImageData(src, 0, 0);
  return out;
}

/* ── paper ────────────────────────────────────────────────────────────────────
   Cloudy mottling rather than fine grain: the reference shows blotches a few
   hundred px across at low contrast. Baked once, never recomputed, because any
   per-frame regeneration flickers.                                           */

let paper = null;

function bakePaper() {
  const c = cv(OUT, OUT), x = c.getContext('2d');
  x.setTransform(K, 0, 0, K, 0, 0);
  x.fillStyle = PAPER; x.fillRect(0, 0, W, W);

  const r = rngFor('paper');

  // Mottling is a warm wash with noisy alpha, not a neutral multiply: greyscale
  // noise multiplied over cream desaturates it and reads as smoke rather than
  // paper. Keep it subtle at full size and only obvious when zoomed.
  for (const [res, maxA] of [[30, 0.10], [72, 0.075], [165, 0.05]]) {
    const n = cv(res, res), nx = n.getContext('2d');
    const img = nx.createImageData(res, res);
    for (let i = 0; i < res * res; i++) {
      img.data[i * 4] = 0xB4; img.data[i * 4 + 1] = 0xA6; img.data[i * 4 + 2] = 0x8C;
      img.data[i * 4 + 3] = Math.pow(r(), 1.8) * 255 * maxA;
    }
    nx.putImageData(img, 0, 0);
    x.save();
    x.imageSmoothingEnabled = true;
    x.imageSmoothingQuality = 'high';
    x.drawImage(n, 0, 0, W, W);
    x.restore();
  }

  x.save();                                  // fibres
  x.strokeStyle = '#8a7f6a';
  for (let i = 0; i < 420; i++) {
    const px = r() * W, py = r() * W, len = 5 + r() * 22, ang = r() * Math.PI;
    x.globalAlpha = 0.008 + r() * 0.016;
    x.lineWidth = 0.5 + r() * 0.7;
    x.beginPath();
    x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.cos(ang) * len * 0.5 + (r() - 0.5) * 5,
                       py + Math.sin(ang) * len * 0.5 + (r() - 0.5) * 5,
                       px + Math.cos(ang) * len, py + Math.sin(ang) * len);
    x.stroke();
  }
  x.restore();

  x.save();                                  // flecks
  for (let i = 0; i < 2200; i++) {
    x.globalAlpha = 0.012 + r() * 0.03;
    x.fillStyle = r() < 0.55 ? '#7d7362' : '#ffffff';
    x.beginPath();
    x.arc(r() * W, r() * W, 0.4 + r() * 1.0, 0, Math.PI * 2);
    x.fill();
  }
  x.restore();
  return c;
}

/* ── scene drawing helpers ────────────────────────────────────────────────────
   Scenes draw coverage in 1080-space and alpha is tone, so 0.4 means a 40%
   dot screen. Shape helpers carry hand wobble; nothing here is a true circle
   or a straight line.                                                        */

function makeWob(rng, harmonics = 3) {
  const h = [];
  for (let i = 0; i < harmonics; i++) h.push([2 + i, rng() * 2 - 1, rng() * Math.PI * 2]);
  return (th) => h.reduce((s, [k, a, p]) => s + a * Math.sin(k * th + p), 0) / harmonics;
}

const tone = (g, a) => { g.globalAlpha = clamp(a, 0, 1); };


/* ── scene registry ───────────────────────────────────────────────────────── */

const SCENES = {};
const scene = (id, def) => { SCENES[id] = Object.assign({ id, live: null }, def); };

const baked = new Map();

/**
 * Bake a scene to one opaque bitmap: every plate screened, tinted, offset and
 * multiplied onto white, ready to multiply over paper.
 *
 * Baked at its display size, never scaled afterwards. Resampling a halftoned
 * bitmap beats the dot grid against the pixel grid and moirés; real print
 * screens at final size too.
 */
function bakeScene(id, size) {
  const key = id + '@' + size;
  if (baked.has(key)) return baked.get(key);
  const sc = SCENES[id];
  const k = size / W;
  const out = cv(size, size), o = out.getContext('2d');
  o.fillStyle = '#fff';
  o.fillRect(0, 0, size, size);

  const cover = cv(size, size), g = cover.getContext('2d');
  for (const ink of sc.inks) {
    const plate = ink;
    g.setTransform(k, 0, 0, k, 0, 0);
    g.clearRect(0, 0, W, W);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = g.strokeStyle = '#000';
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.save();
    sc.plates(g, ink, rngFor(id + ':' + ink), rngFor(id + ':shape'));
    g.restore();
    starve(g, rngFor(id + ':' + ink + ':void'));

    const dots = screenCoverage(cover, plate);
    const tin = cv(size, size), tx = tin.getContext('2d');
    tx.drawImage(dots, 0, 0);
    tx.globalCompositeOperation = 'source-in';
    tx.fillStyle = INK[plate];
    tx.fillRect(0, 0, size, size);

    const [rx, ry] = REG[plate];
    o.save();
    o.globalCompositeOperation = 'multiply';
    o.drawImage(tin, rx, ry);
    o.restore();
  }
  baked.set(key, out);
  return out;
}

/** Ink starvation: evenly filled solids read as laser print, so drop flecks. */
function starve(g, rng) {
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-out';
  const w = g.canvas.width, n = Math.round(w * 1.1);
  for (let i = 0; i < n; i++) {
    g.globalAlpha = 0.2 + rng() * 0.55;
    g.beginPath();
    g.arc(rng() * w, rng() * w, (0.5 + rng() * 2.0) * K, 0, Math.PI * 2);
    g.fill();
  }
  g.restore();
}

/* ── craft kit ────────────────────────────────────────────────────────────────
   Drawing vocabulary for scene plates. Copy this whole block into a new film,
   between starve() and the scenes.

   Shapes are Path2D values rather than marks on the context, so one shape can
   be filled on one plate, knocked out of another and hatched on a third. That
   is what plate discipline needs, and it removes the usual trap of rebuilding
   a shape per ink and having the knockout miss.

   Everything draws coverage in 1080-space: fill style is already '#000' and
   globalAlpha is tone, so 0.4 means a 40% dot screen.                        */

const TAU = Math.PI * 2;

/* — shape builders ——————————————————————————————————————————————— */

/** Catmull-Rom through pts, as a dense polyline. */
function curve(pts, closed, per) {
  per = per || 12;
  const n = pts.length, out = [];
  const at = (i) => pts[closed ? (i + n * 2) % n : clamp(i, 0, n - 1)];
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    for (let k = 0; k < per; k++) {
      const u = k / per, u2 = u * u, u3 = u2 * u;
      out.push([
        0.5 * (2 * p1[0] + (p2[0] - p0[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2
               + (3 * p1[0] - p0[0] - 3 * p2[0] + p3[0]) * u3),
        0.5 * (2 * p1[1] + (p2[1] - p0[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2
               + (3 * p1[1] - p0[1] - 3 * p2[1] + p3[1]) * u3),
      ]);
    }
  }
  if (!closed) out.push(pts[n - 1].slice());
  return out;
}

/** Points around an ellipse, for feeding cut(). */
function ringPts(x, y, rx, ry, n, rot) {
  const out = [], c = Math.cos(rot || 0), s = Math.sin(rot || 0);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU, px = Math.cos(th) * rx, py = Math.sin(th) * ry;
    out.push([x + px * c - py * s, y + px * s + py * c]);
  }
  return out;
}

/**
 * Closed hand-cut contour through control points: the silhouette builder.
 * A shape made of arcs and ellipses reads as clip art however good the screen
 * is, because every edge has the same machine curvature.
 *   o.amp   edge waver in px — 2 is a drawn line, 8 is torn stock
 *   o.tear  0..1 chance per sample of a deeper bite inward
 */
function cut(pts, rng, o) {
  o = o || {};
  const amp = o.amp === undefined ? 3 : o.amp, tear = o.tear || 0;
  const c = curve(pts, true, o.per || 10), n = c.length;
  let area = 0;
  for (let i = 0; i < n; i++) {
    const a = c[i], b = c[(i + 1) % n];
    area += a[0] * b[1] - b[0] * a[1];
  }
  const sgn = area > 0 ? 1 : -1;            // keep the normal pointing outward

  /* Displace along the normal, then smooth: an unsmoothed tear lands on one
     sample and reads as damage rather than as a bay in the edge. */
  const w1 = makeWob(rng, 4), w2 = makeWob(rng, 9), d = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU;
    d[i] = (w1(th) + w2(th * 3) * 0.3) * amp;
    if (tear && rng() < tear) d[i] -= amp * (1.4 + rng() * 1.6);
  }
  for (let pass = 0; pass < 2; pass++) {
    const s = Float32Array.from(d);
    for (let i = 0; i < n; i++) d[i] = (s[(i - 1 + n) % n] + s[i] * 2 + s[(i + 1) % n]) * 0.25;
  }

  const p = new Path2D();
  for (let i = 0; i < n; i++) {
    const a = c[(i - 1 + n) % n], b = c[(i + 1) % n];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const x = c[i][0] + sgn * ty * d[i], y = c[i][1] - sgn * tx * d[i];
    i ? p.lineTo(x, y) : p.moveTo(x, y);
  }
  p.closePath();
  return p;
}

/**
 * Variable-width ribbon along a path, as a fillable shape. Canvas has no
 * pressure, so a constant lineWidth is the default and it is what makes stems,
 * branches, whiskers and rigging read as wire. wfn(u) returns half-width.
 */
function nib(pts, wfn, o) {
  o = o || {};
  const c = o.raw ? pts : curve(pts, false, o.per || 10);
  const n = c.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const w = Math.max(0.01, wfn(i / (n - 1)));
    L.push([c[i][0] - ty * w, c[i][1] + tx * w]);
    R.push([c[i][0] + ty * w, c[i][1] - tx * w]);
  }
  const p = new Path2D();
  p.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) p.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(R[i][0], R[i][1]);
  p.closePath();
  return p;
}

/** Width profiles for nib(). */
const wTip = (w) => (u) => w * (1 - u * u);                       // full, lifting to a point
const wSwell = (w, at, k) => (u) => w * Math.exp(-Math.pow((u - at) / (k || 0.35), 2));
const wLeaf = (w, skew) => (u) => w * Math.pow(Math.sin(Math.PI * Math.pow(u, skew || 0.55)), 1.15);

/**
 * Calligraphic width from a held nib: widest where the path runs across the
 * nib's axis, thinnest where it runs along it. This is where hand-drawn line
 * weight comes from, and it is what makes a contour read as drawn rather than
 * traced. Pass the same polyline you give nib(), with raw: true.
 */
function wNib(c, w0, ang, floor) {
  const n = c.length, f = floor === undefined ? 0.22 : floor;
  return (u) => {
    const i = clamp(Math.round(u * (n - 1)), 0, n - 1);
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    const th = Math.atan2(b[1] - a[1], b[0] - a[0]);
    return w0 * (f + (1 - f) * Math.abs(Math.sin(th - ang)));
  };
}

/**
 * A horizon band closed to the bottom of the frame: hills, treeline, roofline,
 * wave. Stack several at falling tone and the air between them reads as depth.
 *   o.amp  height of the undulation   o.freq  how many bumps across the frame
 *   o.tilt fraction of W the far end drops   o.teeth adds a jagged octave
 */
function ridgeAt(y, o) {
  const amp = o.amp === undefined ? 60 : o.amp;
  const w = makeWob(o.rng, o.harm || 5), t = o.teeth ? makeWob(o.rng, 7) : null;
  return (u) => y + w(u * (o.freq || 5)) * amp + (o.tilt || 0) * (u - 0.5) * W
                + (t ? t(u * 37) * amp * 0.22 : 0);
}

/**
 * Mountain profile: overlapping triangular peaks with a jagged octave on top,
 * because a skyline built from smooth harmonics always reads as hills however
 * tall it is. Same u -> y contract as ridgeAt, so ridge() takes either.
 */
function peaksAt(y, o) {
  const amp = o.amp === undefined ? 90 : o.amp, n = o.n || 5, ps = [];
  for (let i = 0; i < n; i++) {
    ps.push({ c: (i + 0.5) / n + (o.rng() - 0.5) * 0.7 / n,
              h: amp * (0.4 + o.rng() * 0.6), w: (0.55 + o.rng() * 0.9) / n,
              lean: (o.rng() - 0.5) * 0.7 });
  }
  const jag = makeWob(o.rng, 8);
  return (u) => {
    let top = y;
    for (const p of ps) {
      const d = (u - p.c) / p.w;
      const yy = y - p.h * Math.max(0, 1 - Math.abs(d)) * (1 + p.lean * (d > 0 ? 1 : -1));
      if (yy < top) top = yy;
    }
    return top + jag(u * 26) * amp * 0.06;
  };
}

/** x across the frame -> the u that ridgeAt takes, for planting on a skyline. */
const ridgeU = (x) => (x + 60) / (W + 120);

function ridge(y, o) {
  o = o || {};
  const f = typeof y === 'function' ? y : ridgeAt(y, o);
  const n = o.n || 120, p = new Path2D();
  p.moveTo(-60, W + 60);
  for (let i = 0; i <= n; i++) p.lineTo(-60 + i / n * (W + 120), f(i / n));
  p.lineTo(W + 60, W + 60);
  p.closePath();
  return p;
}

/* — paint operations ————————————————————————————————————————————— */

/** Fill a shape at a tone. */
function print(g, path, a) { tone(g, a === undefined ? 1 : a); g.fill(path); }

/** Knock a shape out of the plate underneath it, at full coverage.
    A knockout drawn at a tone leaves the screen's gaps behind, so the plate
    below shows through the holes — always clear solid. */
function carve(g, path) {
  g.save();
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'destination-out';
  g.fill(path);
  g.restore();
}

/**
 * Print a shape at an exact tone, clearing whatever the plate already holds
 * beneath it. Tones on one plate add where they overlap, so a stack of ridges
 * drawn back to front ends up solid at the bottom of the frame — which looks
 * like a colour band rather than land. Every plane in a depth stack goes
 * through here.
 */
function plane(g, path, a) { carve(g, path); print(g, path, a); }

/** Outline a shape. Line work fades on width and alpha, never on coverage. */
function keyline(g, path, w, a) {
  tone(g, a === undefined ? 1 : a);
  g.lineWidth = w === undefined ? 3 : w;
  g.stroke(path);
}

/**
 * Tone ramp inside a shape — a coverage gradient, which the screen turns into
 * a dot-size ramp. This is the signature riso gesture and neither film uses it.
 * Baked plates only: a live inkPass screens at one flat coverage, so a gradient
 * there prints smooth, which is the thing the brief forbids.
 *   o.stops  [[at, tone], ...]      o.x0,y0,x1,y1  linear
 *   o.x,y,r0,r  radial
 */
function shade(g, path, o) {
  g.save();
  if (path) g.clip(path);
  const grd = o.r !== undefined
    ? g.createRadialGradient(o.x, o.y, o.r0 || 0, o.x, o.y, o.r)
    : g.createLinearGradient(o.x0, o.y0, o.x1, o.y1);
  for (const [at, a] of o.stops) grd.addColorStop(clamp(at, 0, 1), 'rgba(0,0,0,' + clamp(a, 0, 1) + ')');
  if (o.cut) g.globalCompositeOperation = 'destination-out';
  g.globalAlpha = 1;
  g.fillStyle = grd;
  g.fillRect(-W, -W, W * 3, W * 3);
  g.restore();
}

/**
 * Parallel hatching clipped to a shape: tone made of line rather than dot.
 * Next to the screen it reads as engraving, and it is how a mid-value stops

/* ── loop and program clocks ──────────────────────────────────────────────── */
const L = 60, TR = 12;

/* ── the coach: wall, window reveal, louvres, bars, sill, kulhad ─────────────
   Camera sits inside the compartment facing the window, eye near y 480.
   O is the opening in the wall plane (near), I the window frame (far); the four
   reveal faces between them give the wall its thickness. The view shows through
   aperture A, crossed by three horizontal steel bars (sleeper class).        */
const O = [58, 66, 1022, 874], I = [100, 108, 980, 792], A = [114, 122, 966, 778];

const BARS = [322, 486, 646], BAR_H = 15;
const VP = [540, 470];
const APERTURE = rrect(A[0], A[1] + LOUVRE, A[2], A[3], 20);

/* Neutral daylight colours; a passage's light scales and tints them. */
const BASE = {
  wall: C(.10, .09, 0, .05, 0), wallLow: C(.14, .13, 0, .12, .02),
  revTop: C(.12, .14, 0, .22, .08), revSide: C(.12, .12, 0, .12, .02),
  sill: C(.08, .07, 0, .04, 0), lip: C(.14, .16, 0, .22, .08),
  frame: C(.03, .05, 0, .20, .10), bar: C(.04, .10, .02, .46, .40), barTop: C(.02, .04, 0, .16, .08),
  louvre: C(.05, .07, 0, .24, .10), louvreDark: C(.07, .1, 0, .42, .26),
  cup: C(.64, .54, 0, .16, .04), cupDark: C(.60, .58, 0, .32, .12), cupIn: C(.5, .5, 0, .46, .3),
  chai: C(.46, .34, 0, .22, .05),

const KUL = { x: 802, base: 860, rim: 738, rR: 50, rRy: 13, bR: 35, bRy: 9 };
function kulhadBody() {
  const k = KUL, pts = [];
  const prof = [[k.rR, k.rim], [k.rR - 3, k.rim + 30], [k.rR - 8, k.rim + 70], [k.bR + 2, k.base - 12], [k.bR, k.base]];
  for (const [r, y] of prof) pts.push([k.x - r, y]);

const KUL_BODY = kulhadBody();

function interior(tl, th, chaiLevel, steam) {
  const Lc = c => lit(c, th);
  // wall with the opening cut out; darker toward the floor
  const wall = new Path2D(); wall.rect(0, 0, W, W); wall.rect(O[0], O[1], O[2] - O[0], O[3] - O[1]);
  put(wall, rampC([0, 700, W], [Lc(BASE.wall), Lc(BASE.wall), Lc(BASE.wallLow)]), 'evenodd');
  // panel seam and a trim strip below the sill
  add(rect(0, 968, W, 5), Lc(scaleC(BASE.revTop, .8)));
  add(rect(0, 973, W, 3), KALL(0));
  knock(rect(0, 965, W, 2), KALL(.5));
  // reveals: top underside darkest, sides mid, sill top lightest
  put(poly([[O[0], O[1]], [O[2], O[1]], [I[2], I[1]], [I[0], I[1]]]), Lc(BASE.revTop));
  put(poly([[O[0], O[1]], [I[0], I[1]], [I[0], I[3]], [O[0], O[3]]]), rampC([O[1], O[3]], [Lc(BASE.revSide), Lc(scaleC(BASE.revSide, 1.25))]));
  put(poly([[O[2], O[1]], [I[2], I[1]], [I[2], I[3]], [O[2], O[3]]]), rampC([O[1], O[3]], [Lc(BASE.revSide), Lc(scaleC(BASE.revSide, 1.25))]));
  const sillP = poly([[I[0], I[3]], [I[2], I[3]], [O[2], O[3]], [O[0], O[3]]]);
  put(sillP, rampC([I[3], O[3]], [Lc(scaleC(BASE.sill, 1.3)), Lc(BASE.sill)]));
  // light from the view spills onto the sill
  if (th.spillA > 0) {
    const sp = poly([[I[0] + 30, I[3]], [I[2] - 30, I[3]], [O[2] - 60, O[3] - 8], [O[0] + 60, O[3] - 8]]);
    knock(sp, scaleC(KALL(1), th.spillA * .7));
    add(sp, scaleC(th.spill, th.spillA));
  }
  // sill lip
  put(rect(O[0] - 6, O[3], O[2] - O[0] + 12, 20), rampC([O[3], O[3] + 20], [Lc(BASE.sill), Lc(BASE.lip)]));
  knock(rect(O[0] - 6, O[3], O[2] - O[0] + 12, 2), KALL(.6));
  add(rect(O[0] - 6, O[3] + 20, O[2] - O[0] + 12, 7), Lc(scaleC(BASE.wallLow, .9)));
  // edges of the reveal catch light
  strokeKnockLine([[I[0], I[3]], [I[2], I[3]]], 2, .55);
  // aluminium frame: a channel round the aperture
  const fr = new Path2D(); fr.rect(I[0], I[1], I[2] - I[0], I[3] - I[1]); rrect(A[0], A[1], A[2], A[3], 20, fr);
  put(fr, Lc(BASE.frame), 'evenodd');
  strokeCov(rrect(A[0] - 1, A[1] - 1, A[2] + 1, A[3] + 1, 21), 3.2, Lc(C(0, .06, 0, .5, .45)));
  // louvred shutter, lowered a little
  const n = 2, hS = LOUVRE / n;
  for (let i = 0; i < n; i++) {
    const y = A[1] + i * hS;
    put(rect(A[0], y, A[2] - A[0], hS), rampC([y, y + hS], [Lc(BASE.louvre), Lc(BASE.louvreDark)]));
    knock(rect(A[0], y, A[2] - A[0], 1.6), KALL(.55));
  }
  add(rect(A[0], A[1] + LOUVRE, A[2] - A[0], 3), Lc(BASE.louvreDark));
  // bars, fixed into the frame
  for (const y of BARS) {
    const b = rect(A[0] - 10, y - BAR_H / 2, A[2] - A[0] + 20, BAR_H);
    put(b, rampC([y - BAR_H / 2, y + BAR_H / 2], [Lc(BASE.barTop), Lc(BASE.bar), Lc(scaleC(BASE.bar, 1.25))]));
    knock(rect(A[0] - 10, y - BAR_H / 2, A[2] - A[0] + 20, 2.2), KALL(.8));

}
function strokeKnockLine(pts, w, a) { strokeKnock(pline(pts), w, a); }
function strokeKnockRect(x0, y0, x1, y1, w, a) { strokeKnock(rrect(x0, y0, x1, y1, 22), w, a); }

function kulhad(tl, th, level, steam) {
  const k = KUL, Lc = c => lit(c, th);
  // contact shadow falls toward us (the light is the window behind the cup)
  const sh = new Path2D(); sh.ellipse(k.x + 4, k.base + 5, k.bR + 18, k.bRy + 5, 0, 0, TAU);
  add(sh, Lc(C(.04, .06, 0, .22, .12)));
  put(KUL_BODY, { ...(() => { const o = {}; const a = Lc(BASE.cup), b = Lc(BASE.cupDark); for (const n of PL) o[n] = { x0: k.x - k.rR, y0: 0, x1: k.x + k.rR, y1: 0, at: [0, .35, .7, 1], as: [b[n], a[n], a[n], b[n] * 1.08] }; return o; })() });
  // rough clay: a few darker rings from the wheel, and grit
  const rings = new Path2D();
  for (const [yy, a] of [[k.rim + 24, .5], [k.rim + 58, .4], [k.rim + 90, .35]]) {
    const u = (yy - k.rim) / (k.base - k.rim), r = lerp(k.rR, k.bR, u) - 2;

  }

  for (let i = 0; i < 70; i++) { const u = gr(), y = lerp(k.rim + 16, k.base - 4, u), r = lerp(k.rR, k.bR, u) - 4, x = k.x + (gr() * 2 - 1) * r; grit.moveTo(x + 1, y); grit.arc(x, y, .6 + gr() * .9, 0, TAU); }

      const s = new Path2D(); s.ellipse(k.x, y + bob, rx, ry, tilt, 0, TAU);
      put(s, Lc(BASE.chai));

      knock(hl, KALL(.45));
    });
  }
  const lip = new Path2D(); lip.ellipse(k.x, k.rim, k.rR - 1, k.rRy, 0, Math.PI * 1.02, Math.PI * 1.98);
  strokeKnock(lip, 2.2, .7);
  const lipF = new Path2D(); lipF.ellipse(k.x, k.rim, k.rR - 1, k.rRy, 0, Math.PI * .05, Math.PI * .95);
  strokeCov(lipF, 2, Lc(C(.1, .14, 0, .1, .04)));

  if (steam > 0.01) {
    for (let j = 0; j < 4; j++) {
      const ph = fract(tl * 5 / L + j / 4 + h01('st' + j) * .1), a = life01(ph, .3) * steam;

  }
}

/* ── shared outside pieces ────────────────────────────────────────────────── */
function skyC(hy, alts, cs) { return rampC(alts.map(a => hy - a).reverse(), cs.slice().reverse()); }

/* Overhead-equipment masts of the electrified line, the nearest thing outside.
   p > 1: closer than the track bed; smeared by their own speed. */
function masts(s, D, V, cov, o = {}) {
  const p = o.p || 1.25, N = Math.max(1, Math.round(D / (o.spacing || 1300)));
  const m = mask(0), d = V * p / 30 * 0.55, pos = [];
  visit('mast', N, D, s, p, 120, (k, x) => pos.push(x));
  if (!pos.length) return;
  const top = A[1] + LOUVRE - 10;
  smear(m, d, g => {
    for (const x of pos) {
      g.fillRect(x - 13, top, 26, W - top);                     // H-beam
      g.fillRect(x - 17, 604, 34, 7);                            // bracket bands
      g.fillRect(x - 17, 420, 34, 6);
      g.beginPath(); g.moveTo(x + 12, 250); g.lineTo(x + 150, 214); g.lineTo(x + 150, 222); g.lineTo(x + 12, 262); g.fill();  // cantilever
      g.beginPath(); g.moveTo(x + 12, 330); g.lineTo(x + 120, 222); g.lineTo(x + 126, 226); g.lineTo(x + 16, 338); g.fill();  // stay
    }
  });
  putM(m, cov);
  if (o.edge) {                                     // lit flange edge
    const m2 = mask(1);
    smear(m2, d, g => { for (const x of pos) g.fillRect(x - 13, top, 3.5, W - top); });
    const c = m2.canvas;
    for (const n of PL) { const g = PG[n]; g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'destination-out'; g.globalAlpha = o.edge; g.drawImage(c, 0, 0); g.restore(); }
  }
}

/* Canopy row on the ground plane at parallax p: lumpy crowns, lit rims. */
function canopyRow(key, s, D, p, top, amp, cov, rimCov, o = {}) {
  const f = pridge(key, D, o.comps || [[40, .5], [97, .35], [173, .3], [311, .2], [520, .12]]);
  const fn = x => { const X = s + (x - 540) / p; const v = f(X); return amp * (0.55 + 0.45 * Math.abs(v) + 0.25 * v); };
  const path = skylinePath(fn, top, W + 20, -20, W + 20, o.dx || 5);
  if (o.smear) {
    const m = mask(1); smear(m, o.smear, g => g.fill(path)); putM(m, cov);
  } else put(path, cov);
  if (rimCov) {
    const rim = new Path2D();
    for (let x = -20; x <= W + 20; x += 5) { const y = top - fn(x); x === -20 ? rim.moveTo(x, y) : rim.lineTo(x, y); }
    strokeCov(rim, o.rimW || 5, rimCov);
  }
  return fn;
}

/* Rain: slanting streaks, periodic in the loop (integer passes per loop). */
function rain(tl, V, n, a, o = {}) {
  const r = rngFor('rain:' + (o.key || '')), H = W + 160, Wd = W + 400, path = new Path2D();
  const vy = Math.round(62 * H / L / H * 1) * H / L * (o.fall || 1);             // ~62 passes per loop
  const kx = Math.round((V * 0.25) * L / Wd) || 1, vx = kx * Wd / L;
  for (let i = 0; i < n; i++) {
    const y0 = r() * H, x0 = r() * Wd, len = 14 + r() * 26, dep = .5 + r() * .5;
    const y = ((y0 + vy * dep * tl) % H + H) % H - 80;
    const vyy = vy * dep; // dep changes speed; keep integer passes per loop
    const passes = Math.max(1, Math.round(vyy * L / H)), yy = ((y0 + passes * H / L * tl) % H) - 80;
    const x = ((x0 - vx * tl) % Wd + Wd) % Wd - 200;
    const sl = vx / (passes * H / L);
    path.moveTo(x, yy); path.lineTo(x - len * sl, yy - len);
  }
  strokeKnock(path, o.w || 1.3, a);
  if (o.dark) strokeCov(path, .8, o.dark);
}

/* Tree crowns along a ground row at parallax p: each crown a cluster of
   lobes, tops lightened, filled down to the frame bottom so rows never gap. */
function crowns(key, s, D, p, baseY, size, N, cov, o = {}) {
  const body = new Path2D(), tops = new Path2D();
  body.rect(-20, baseY, W + 40, W - baseY + 20);
  visit(key, N, D, s, p, size * 2, (k, x) => {
    const r = rngFor(key + ':' + k), sz = size * (0.7 + r() * 0.6), h = sz * (0.8 + r() * 0.5), n = 3 + Math.floor(r() * 3);
    for (let j = 0; j < n; j++) {
      const ox = (r() - .5) * sz * 1.3, oy = -h * (0.35 + r() * .5), rx = sz * (0.45 + r() * .35), ry = rx * (0.75 + r() * .2);
      body.moveTo(x + ox + rx, baseY + oy); body.ellipse(x + ox, baseY + oy, rx, ry, 0, 0, TAU);
      if (o.top) { tops.moveTo(x + ox - rx * .15 + rx * .55, baseY + oy - ry * .35); tops.ellipse(x + ox - rx * .15, baseY + oy - ry * .35, rx * .55, ry * .4, 0, 0, TAU); }
    }
    if (o.trunk) body.rect(x - sz * .05, baseY - h * .2, sz * .1, h * .4);
  });
  if (o.smear) { const m = mask(1); smear(m, o.smear, g => g.fill(body)); putM(m, cov); }
  else put(body, cov);
  if (o.top) {
    if (o.smear) { const m = mask(2); smear(m, o.smear, g => g.fill(tops)); const c = m.canvas; for (const n in o.top) { const g = PG[n]; g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = o.top[n] < 0 ? 'destination-out' : 'source-over'; g.globalAlpha = Math.abs(o.top[n]); g.drawImage(c, 0, 0); g.restore(); } }
    else for (const n in o.top) { const g = PG[n]; g.globalCompositeOperation = o.top[n] < 0 ? 'destination-out' : 'source-over'; g.globalAlpha = Math.abs(o.top[n]); g.fillStyle = '#000'; g.fill(tops); g.globalAlpha = 1; }
  }
}

/* A crisp cloud or mist bank: scalloped top, soft-free, drifting whole
   periods per loop. Knocked toward paper so it reads as light. */
function bank(tl, key, y, h, bump, cycles, a, o = {}) {
  const Pc = o.period || 2400, off = fract(tl * cycles / L) * Pc * (o.dir || 1);
  const f = x => { const u = (x + off) / Pc; let v = 0; for (let k = 1; k <= 3; k++) v += Math.sin(TAU * (u * [3, 7, 13][k - 1]) + h01(key + k) * TAU) / k; return v; };
  const top = x => y - h * (.55 + .45 * f(x)) - (o.bumpH || 7) * Math.pow(Math.abs(Math.sin(Math.PI * (x + off) / bump)), .5);
  const p = new Path2D(); p.moveTo(-20, y + (o.depth || 30));
  for (let x = -20; x <= W + 20; x += 4) p.lineTo(x, top(x));
  p.lineTo(W + 20, y + (o.depth || 30)); p.closePath();
  if (o.cov) put(p, o.cov); else knock(p, KALL(a));
  if (o.floor) knock(rect(-20, y + (o.depth || 30) - 1, W + 40, 2), KALL(0));
  return top;
}

/* ── Passage 4: the Western Ghats in the afternoon rains ────────────────────
   Across a deep valley: a flat-topped basalt scarp, its black cliff band under
   the lip, forest tiers below, threads of water after the rains and one big
   falls; a mist bank lies in the valley; rain across everything.            */
function viewGhats(tl, P) {
  const hy = P.hy, s = P.V * tl, D = P.V * L;
  put(rect(0, 0, W, hy + 60), skyC(hy, [0, 140, 300, 440], [C(.03, .05, 0, .06, 0), C(0, .05, 0, .12, .02), C(0, .07, 0, .22, .07), C(0, .08, 0, .3, .12)]));
  // heavy cloud: crisp dark masses with paler bellies
  bank(tl, 'gk1', hy - 330, 50, 90, 1, 0, { cov: C(0, .08, 0, .28, .16), depth: 400, period: 2600, dir: -1 });
  bank(tl, 'gk2', hy - 250, 30, 70, 2, 0, { cov: C(0, .06, 0, .18, .08), depth: 30, period: 2200, dir: -1 });
  rainShafts(tl, hy);
  // far plateau at infinity
  const far = sridge('pp:gfar', [[1300, 12], [520, 5], [180, 2]]);
  const farAlt = x => 172 + far(x) - (x > 760 ? 22 * sm((x - 760) / 60) : 0);
  put(skylinePath(farAlt, hy, hy + 80), C(.03, .12, .04, .24, .07));
  put((() => { const b = new Path2D(); for (let x = -20; x < W + 20; x += 4) b.rect(x, hy - farAlt(x) + 4, 4.2, 12 + 4 * Math.sin(x * .031)); return b; })(), C(.02, .14, .02, .32, .14));
  strokeKnock(skylineStroke(farAlt, hy, 1), 1.8, .6);
  // the scarp (p = .065)
  const pR = 0.065, R = pridge('pp:grange', D, [[1, 12], [2, 9], [3, 7], [5, 5], [9, 3], [17, 1.5]]);
  const notch = pridge('pp:gnotch', D, [[4, 1], [7, .7], [11, .5]]);
  const WX = x => s + (x - 540) / pR;
  const alt = x => { const X = WX(x); return 142 + R(X) - 30 * sm((notch(X) - .9) / .5); };
  const band1 = x => 26 + 14 * Math.abs(Math.sin(WX(x) * TAU * 23 / D));
  const alt2 = x => { const X = WX(x); return 78 + 8 * Math.sin(X * TAU * 13 / D + 1) + 5 * Math.sin(X * TAU * 31 / D); };
  const base = hy + 84;
  const rangeP = skylinePath(alt, hy, base + 60, -20, W + 20, 3);
  put(rangeP, C(.05, .12, .04, .44, .36));
  const scal = (aFn, bump, h) => x => { const X = WX(x), b = bump / pR; return aFn(x) - h * Math.pow(Math.abs(Math.sin(Math.PI * X / b)), .6); };
  withClip(rangeP, () => {
    const streak = new Path2D();
    for (let k = -1; k < 140; k++) {
      const X = Math.floor((s - 560 / pR) / 130) * 130 + k * 130, id = Math.round(X / 130);
      const x = 540 + (X - s) * pR + (h01('hs' + id) - .5) * 8;
      if (x > W + 20) break;
      const y0 = hy - alt(x) + 6;
      streak.moveTo(x, y0); streak.lineTo(x + .8, y0 + band1(x) * (.5 + h01('hl' + id) * .5));
    }
    strokeCov(streak, 1.6, C(0, .03, 0, .1, .1));
    const t1 = scal(x => alt(x) - band1(x), 34, 10);
    put(skylinePath(t1, hy, base + 60, -20, W + 20, 3), C(.3, .02, .56, .24, .06));
    strokeCov(skylineStroke(t1, hy, 1.4), 2.6, C(.46, 0, .2, 0, 0));
    const outc = new Path2D();
    for (let x = -20; x < W + 20; x += 3) {
      const X = WX(x), on = Math.sin(X * TAU * 9 / D + 2) + .5 * Math.sin(X * TAU * 29 / D);
      if (on > -.1) outc.rect(x, hy - alt2(x) - 4, 3.3, 8 + 16 * clamp(on + .1, 0, 1));
    }
    put(outc, C(.04, .12, .03, .44, .36));
    const t2 = scal(x => alt2(x) - 16, 26, 8);
    put(skylinePath(t2, hy, base + 60, -20, W + 20, 3), C(.14, .03, .64, .48, .22));
    strokeCov(skylineStroke(t2, hy, 1.4), 2.2, C(.34, 0, .16, 0, 0));
    // gullies: darker clefts down the lower slope, and crown tops catching light
    visit('pp:gully', 9, D, s, pR, 60, (k, x) => {
      const top = hy - alt2(x) + 10, w = 10 + h01('gw' + k) * 14;
      const g = new Path2D(); g.moveTo(x - w * .25, top); g.quadraticCurveTo(x - w * .1, top + 60, x - w, base + 40); g.lineTo(x + w, base + 40); g.quadraticCurveTo(x + w * .2, top + 60, x + w * .25, top); g.closePath();
      add(g, C(0, .03, .08, .16, .12));
    });
    const lt = new Path2D();
    for (let k = -1; k < 300; k++) {
      const X = Math.floor((s - 560 / pR) / 60) * 60 + k * 60, id = Math.round(X / 60), x = 540 + (X - s) * pR;
      if (x > W + 20) break;
      for (let j = 0; j < 3; j++) {
        const y = hy - alt2(x) + 14 + h01('ly' + id + j) * (alt2(x) - 10), r = 3 + h01('lr' + id + j) * 3, xx = x + j * 1.3;
        lt.moveTo(xx - r, y); lt.quadraticCurveTo(xx, y - r * 1.1, xx + r, y);
      }
    }
    strokeCov(lt, 1.8, C(.34, 0, .12, 0, 0));
    const t3 = scal(x => 30 + 6 * Math.sin(WX(x) * TAU * 7 / D), 20, 6);
    put(skylinePath(t3, hy, base + 60, -20, W + 20, 3), C(.22, .03, .58, .34, .1));
    strokeCov(skylineStroke(t3, hy, 1.4), 2, C(.36, 0, .14, 0, 0));
  });
  // threads of water and the big falls
  visit('pp:thread', 16, D, s, pR, 40, (k, x) => {
    if (h01('thr' + k) < .15) return;
    const top = hy - alt(x) + 2, len = (alt(x) - 10) * (.55 + h01('tl' + k) * .45), wv = 2 + h01('tw' + k) * 1.8;
    const pts = []; let xx = x;
    for (let y = top; y <= top + len; y += 14) { pts.push([xx, y]); xx += (h01('tj' + k + ':' + Math.round(y)) - .45) * 2.2; }
    if (pts.length < 2) return;
    knock(nib(pts, u => wv * (1 - .4 * u), { per: 3 }), KALL(.95));
    const sp = 18, vv = Math.round(160 * L / sp) * sp / L, dash = new Path2D();
    for (let y = top + ((vv * tl + h01('td' + k) * sp) % sp); y < top + len - 6; y += sp) { const i = clamp(Math.floor((y - top) / 14), 0, pts.length - 1); dash.moveTo(pts[i][0], y); dash.lineTo(pts[i][0], y + 6); }
    strokeCov(dash, 1, C(0, 0, 0, .28, .12));
  });
  falls(tl, s, D, pR, hy, alt, band1, alt2, 0.37, 13, 'f1');
  // valley floor and the mist bank lying on it
  const pF = 0.12, vf = new Path2D(); vf.rect(0, hy + 90, W, 150);
  put(vf, rampC([hy + 90, hy + 240], [C(.24, .03, .3, .1, .02), C(.3, .04, .46, .22, .06)]));
  const riv = new Path2D(), rv = pridge('pp:griver', D, [[3, 6], [7, 4], [17, 2]]);
  for (let x = -20; x <= W + 20; x += 6) { const y = hy + 118 + rv(s + (x - 540) / pF); x === -20 ? riv.moveTo(x, y) : riv.lineTo(x, y); }
  strokeKnock(riv, 4, .95);
  bank(tl, 'gmist', hy + 96, 16, 60, 1, .88, { depth: 14, period: 2000 });
  bank(tl, 'gmist2', hy - 60, 10, 50, 2, .7, { depth: 8, period: 1800, bumpH: 5 });
  // the slope below the track, three rows of crowns, nearest smeared
  crowns('pp:gt1', s, D, 0.3, hy + 148, 20, Math.round(D / 150), C(.16, .04, .58, .44, .2), { top: { yellow: .3, blue: -.25, indigo: -.15 } });
  crowns('pp:gt2', s, D, 0.58, hy + 205, 34, Math.round(D / 170), C(.12, .05, .64, .54, .3), { top: { yellow: .28, blue: -.3, indigo: -.2 }, smear: P.V * .58 / 30 * .5 });
  crowns('pp:gt3', s, D, 1.0, hy + 300, 56, Math.round(D / 200), C(.08, .06, .62, .6, .42), { top: { yellow: .2, blue: -.3, indigo: -.25 }, smear: P.V / 30 * .55 });
  masts(s, D, P.V, C(.16, .16, .02, .3, .26), { edge: .5 });
  rain(tl, P.V, 170, .45, { key: 'g' });
}
function skylineStroke(fn, hy, dy) { const p = new Path2D(); for (let x = -20; x <= W + 20; x += 4) { const y = hy - fn(x) + dy; x === -20 ? p.moveTo(x, y) : p.lineTo(x, y); } return p; }
function rainShafts(tl, hy) {
  const Pc = 2200, off = fract(tl * 1 / L) * Pc, r = rngFor('pp:shaft');
  for (let i = 0; i < 4; i++) {
    const cx = r() * Pc, w = 60 + r() * 120;
    for (const m of [-1, 0, 1]) {
      const x = ((cx - off) % Pc + Pc) % Pc - 500 + m * Pc;
      if (x + w < 0 || x - w > W) continue;
      const p = new Path2D();
      for (let k = 0; k < 26; k++) { const xx = x - w + k * w * 2 / 26 + (r() - .5) * 6; p.moveTo(xx, hy - 300); p.lineTo(xx - 22, hy - 150 - r() * 30); }
      const g = rampC([hy - 300, hy - 140], [C(0, .05, 0, .2, .12), KALL(0)]);
      for (const n of ['pink', 'blue', 'indigo']) { const G = PG[n]; G.globalCompositeOperation = 'source-over'; G.lineWidth = 2.2; G.strokeStyle = style(G, g[n]); G.stroke(p); G.strokeStyle = '#000'; }
    }
  }
}

function cloudBands(tl, hy, bands) {
  for (const b of bands) {
    const Pc = W + 900, off = fract(tl * b.wind / L) * Pc, r = rngFor('pp:' + b.key), path = new Path2D();
    for (let i = 0; i < 7; i++) {
      const cx = r() * Pc, w = 180 + r() * 320, h = b.h * (.6 + r() * .6), y = b.y + (r() - .5) * b.h;
      for (const m of [-1, 0, 1]) {
        const x = ((cx - off) % Pc + Pc) % Pc - 450 + m * Pc;
        if (x + w < -40 || x - w > W + 40) continue;
        path.moveTo(x + w, y); path.ellipse(x, y, w, h, 0, 0, TAU);
      }
    }
    add(path, b.cov);
  }
}

function valleyCloud(tl, hy) {
  const Pc = 1500, off = fract(tl * 1 / L) * Pc, r = rngFor('pp:vcl');
  for (let i = 0; i < 9; i++) {
    const cx = r() * Pc, w = 90 + r() * 200, h = 16 + r() * 26, y = hy + 40 + r() * 60 - (r() < .35 ? 110 + r() * 60 : 0);
    for (const m of [-1, 0, 1]) {
      const x = ((cx + off) % Pc + Pc) % Pc - 200 + m * Pc;
      if (x + w * 1.4 < 0 || x - w * 1.4 > W) continue;
      for (const n of PL) {
        const g = PG[n]; g.save(); g.translate(x, y); g.scale(1, h / w);
        g.globalCompositeOperation = 'destination-out';
        g.fillStyle = radial(g, 0, 0, w * .15, w * 1.2, .72, 0); g.fillRect(-w * 1.3, -w * 1.3, w * 2.6, w * 2.6);
        g.restore();
      }
    }
  }
}

/* A falls from the scarp's lip, over both cliff bands, into the valley cloud. */
function falls(tl, s, D, pR, hy, alt, band1, alt2, frac, wid, key) {
  const X = frac * D;
  let x0 = null;
  for (const m of [-1, 0, 1]) { const x = 540 + (X + m * D - s) * pR; if (x > -100 && x < W + 100) x0 = x; }
  if (x0 === null) return;
  const top = hy - alt(x0) - 2, b1 = top + band1(x0), y2 = hy - alt2(x0), bot = hy + 92;
  // free fall down the upper cliff, a skip on the bench, then down the slope
  const pts = [[x0, top], [x0 + 1, top + (b1 - top) * .5], [x0 + 3, b1], [x0 + 9, b1 + 12], [x0 + 12, (b1 + y2) / 2], [x0 + 10, y2], [x0 + 14, y2 + 18], [x0 + 16, (y2 + bot) / 2], [x0 + 18, bot]];
  const w = u => wid * (u < .22 ? 0.35 + u * 1.4 : 0.55 + 0.7 * u) * (1 + 0.14 * Math.sin(u * 19 + 1));
  const rib = nib(pts, w, { per: 6 });
  knock(rib, KALL(1));
  add(rib, { blue: { x0: x0 - wid, y0: 0, x1: x0 + wid * 2, y1: 0, at: [0, .55, 1], as: [0, .05, .2] } });
  const lanes = new Path2D(), sp = 22, vv = Math.round(170 * L / sp) * sp / L, c = curve(pts, false, 6);
  const at = y => { for (let i = 1; i < c.length; i++) if (c[i][1] >= y) { const u = (y - c[i - 1][1]) / Math.max(1e-6, c[i][1] - c[i - 1][1]); return lerp(c[i - 1][0], c[i][0], u); } return c[c.length - 1][0]; };
  for (let j = 0; j < 5; j++) {
    const off = h01(key + 'ln' + j) * sp;
    for (let y = top - sp + ((vv * tl + off) % sp); y < bot - 8; y += sp) {
      if (y < top) continue;
      const u = (y - top) / (bot - top), cx = at(y) + (j / 4 - .5) * w(u) * 1.2;
      lanes.moveTo(cx, y); lanes.lineTo(cx + .5, y + 7 + 6 * u);
    }
  }
  strokeCov(lanes, 1.2, C(0, 0, 0, .28, .1));
  for (const [yy, rr] of [[b1 + 8, 22], [y2 + 12, 30], [bot - 4, 70]]) {
    const br = 0.85 + 0.15 * Math.sin(lw(3) * tl + h01(key + yy) * TAU);
    glowC(at(yy) + 4, yy, 3, rr * br, KALL(.7), 'destination-out');
  }
}

/* ── shared pieces for the other passages ─────────────────────────────────── */
function sunDisc(x, y, r, core, glowR, glowCov) {
  if (glowR) { glowC(x, y, r, glowR, KALL(.75), 'destination-out'); if (glowCov) glowC(x, y, r * .8, glowR * .8, glowCov); }
  const d = cut(ringPts(x, y, r, r, 16), rngFor('pp:sun' + Math.round(x)), { amp: 1 });
  knock(d, KALL(1)); if (core) add(d, core);
}
/** A flock crossing within [t0, t1] of the loop, off-screen at both ends. */
function flock(tl, key, t0, t1, x0, x1, y, n, size, cov, o = {}) {
  if (tl < t0 || tl > t1) return;
  const u = (tl - t0) / (t1 - t0), cx = lerp(x0, x1, u), r = rngFor('pp:fl' + key), path = new Path2D();
  for (let i = 0; i < n; i++) {
    const ox = o.vee ? Math.abs(i - n / 2) * size * 2.6 : r() * size * 18, oy = o.vee ? (i - n / 2) * size * 1.2 : (r() - .5) * size * 7;
    const ph = r() * TAU, hz = (o.hz || 3) * (0.9 + r() * .2);
    const x = cx + ox * (x1 > x0 ? -1 : 1), yy = y + oy + 3 * Math.sin(tl * 1.3 + ph);
    const f = Math.sin(TAU * hz * tl + ph), tip = -f * size * .9, mid = -f * size * .3 - size * .15;
    path.moveTo(x - size, yy + tip); path.quadraticCurveTo(x - size * .4, yy + mid, x, yy); path.quadraticCurveTo(x + size * .4, yy + mid, x + size, yy + tip);
  }
  if (o.knockW) strokeKnock(path, o.knockW, 1);
  strokeCov(path, o.w || 2, cov);
}
const gy = (hy, GK, p) => hy + GK * p;
/** One object per world period, centred in frame at mid-loop: it is off-screen
   at tl = 0 and tl = L, so it may also travel on its own without a seam. */
function visitMid(key, D, s, p, fn) { const X = D * (0.5 + (h01(key) - .5) * .1); for (const m of [-1, 0, 1]) { const x = 540 + (X + m * D - s) * p; if (x > -900 && x < W + 900) fn(0, x, X); } }

/* A shade tree (Albizia): thin leaning trunk, flat layered canopy. */
function shadeTree(path, x, yb, sc, k) {
  const r = rngFor('pp:st' + k), h = (170 + r() * 90) * sc, lean = (r() - .5) * 0.18;
  const tx = x + lean * h;
  path.addPath(nib([[x, yb], [lerp(x, tx, .5) + (r() - .5) * 6 * sc, yb - h * .5], [tx, yb - h]], u => (5 - 3 * u) * sc, { per: 6 }));
  for (const [dx, a] of [[-1, .55], [1, .5]]) path.addPath(nib([[tx, yb - h * .82], [tx + dx * 40 * sc, yb - h * .95]], u => (2.6 - 1.8 * u) * sc, { per: 4 }));
  const layers = 2 + Math.floor(r() * 2);
  for (let j = 0; j < layers; j++) {
    const cy = yb - h - j * 20 * sc + 10 * sc, w = (80 + r() * 50) * sc * (1 - j * .22), hh = (12 + r() * 6) * sc, cx = tx + (r() - .5) * 30 * sc;
    const pts = [];
    for (let i = 0; i < 14; i++) { const a = i / 14 * TAU; pts.push([cx + Math.cos(a) * w * (0.8 + r() * .35), cy + Math.sin(a) * hh * (a > Math.PI ? 1.1 : .6)]); }
    path.addPath(cut(pts, r, { amp: 2.5 * sc + .5 }));
  }
}

/* Long thin lenticular clouds, lit on their undersides (dawn/dusk). */
function streaks(tl, key, n, y0, y1, cov, lit) {
  const Pc = 2600, off = fract(tl / L) * Pc, r = rngFor('pp:' + key);
  for (let i = 0; i < n; i++) {
    const cx = r() * Pc, w = 120 + r() * 220, h = 5 + r() * 7, y = lerp(y0, y1, r());
    for (const m of [-1, 0, 1]) {
      const x = ((cx - off) % Pc + Pc) % Pc - 500 + m * Pc;
      if (x + w < 0 || x - w > W) continue;
      const c = cut([[x - w, y], [x - w * .4, y - h], [x + w * .3, y - h * 1.2], [x + w, y - h * .2], [x + w * .2, y + h * .4], [x - w * .5, y + h * .3]], rngFor(key + i), { amp: 1.5 });
      put(c, cov);
      strokeCov(pline([[x - w * .7, y + h * .25], [x + w * .6, y + h * .2]]), 2, lit);
    }
  }
}

/* ── Passage 1: tea garden at dawn, Assam ───────────────────────────────── */
function viewTea(tl, P) {
  const hy = P.hy, s = P.V * tl, D = P.V * L, GK = 120;
  put(rect(0, 0, W, hy + 40), skyC(hy, [0, 60, 170, 330, 480], [C(.5, .26, 0, 0, 0), C(.34, .3, 0, .02, 0), C(.14, .3, 0, .1, 0), C(.02, .2, 0, .22, .04), C(0, .14, 0, .3, .1)]));
  streaks(tl, 'tcl', 7, hy - 380, hy - 210, C(.1, .4, 0, .1, 0), C(.4, .12, 0, 0, 0));
  sunDisc(330, hy - 150, 30, C(.34, .06, 0, 0, 0), 200, C(.28, .1, 0, 0, 0));
  // far ranges at infinity: Meghalaya hills, two layers, mist at the foot
  const f1 = sridge('pp:tf1', [[700, 26], [260, 11], [90, 4]]), f2 = sridge('pp:tf2', [[520, 18], [200, 8], [70, 3]]);
  put(skylinePath(x => 118 + f1(x) + 30 * Math.exp(-(((x - 760) / 180) ** 2)), hy, hy + 40), C(.04, .22, 0, .2, .04));
  strokeCov(skylineStroke(x => 118 + f1(x) + 30 * Math.exp(-(((x - 760) / 180) ** 2)), hy, 1), 2, C(.3, .2, 0, 0, 0));
  put(skylinePath(x => 66 + f2(x), hy, hy + 40), C(.02, .24, 0, .3, .1));
  strokeCov(skylineStroke(x => 66 + f2(x), hy, 1), 2, C(.34, .24, 0, 0, 0));
  bank(tl, 'tm1', hy - 6, 8, 400, 1, .7, { depth: 12, period: 2200, bumpH: 2 });
  // distant line of shade trees along the horizon (p = .06)
  const far = new Path2D();
  visit('pp:tft', Math.round(D * .06 / 34), D, s, .06, 60, (k, x) => shadeTree(far, x, hy + 6, .3 + h01('fs' + k) * .1, 'f' + k));
  put(far, C(.04, .26, .1, .34, .14));
  // the garden: rows of flat-pruned bushes following the ground, lit from the dawn side
  put(rect(0, hy, W, W - hy + 20), rampC([hy, W], [C(.26, .08, .4, .14, .02), C(.2, .06, .62, .34, .12)]));
  const und = pridge('pp:tund', D, [[2, 1], [5, .5], [11, .25]]);
  let y = hy + 5, i = 0;
  const rows = [];
  while (y < A[3] + 40) { rows.push(y); y += 4 + (y - hy) * 0.24; i++; }
  const lit = new Path2D(), dark = new Path2D();
  for (let r = 0; r < rows.length; r++) {
    const yr = rows[r], p = (yr - hy) / GK, bw = 90 * p + 2, hgt = Math.max(2, 26 * p);
    const top = new Path2D(); let first = true;
    const pts = [];
    for (let x = -20; x <= W + 20; x += Math.max(3, bw / 5)) {
      const X = s + (x - 540) / Math.max(p, .01), yy = yr - und(X) * 10 * p - hgt * (.55 + .45 * Math.pow(Math.abs(Math.sin(Math.PI * X / 90)), .45));
      pts.push([x, yy]);
    }
    const band = new Path2D(); band.moveTo(-20, yr + hgt * .4);
    for (const [x, yy] of pts) band.lineTo(x, yy);
    band.lineTo(W + 20, yr + hgt * .4); band.closePath();
    put(band, rampC([yr - hgt, yr + hgt * .4], [mixC(C(.46, .12, .4, .04, 0), C(.4, .1, .54, .12, 0), clamp(p / 1.4, 0, 1)), mixC(C(.2, .1, .56, .28, .08), C(.1, .08, .64, .44, .2), clamp(p / 1.4, 0, 1))]));
    const rim = pline(pts);
    strokeCov(rim, Math.max(1, 2.6 * p), C(.56, .2, .06, 0, 0));
    dark.moveTo(-20, yr + hgt * .6); dark.lineTo(W + 20, yr + hgt * .6);
  }
  strokeCov(dark, 1.2, C(0, .04, .1, .2, .1));
  // pluckers among the rows (p = .4), baskets on their backs
  visit('pp:pluck', 4, D, s, .4, 40, (k, x) => {
    const yb = gy(hy, GK, .4) - 2, sc = .4 * 1.4, sway = Math.sin(lw(9 + k) * tl + k) * 1.5;
    const body = new Path2D(); body.addPath(cut([[x - 6 * sc, yb], [x - 5 * sc, yb - 22 * sc], [x, yb - 30 * sc], [x + 5 * sc, yb - 22 * sc], [x + 6 * sc, yb]], rngFor('pb' + k), { amp: .4 }));
    const head = new Path2D(); head.ellipse(x + sway * .3, yb - 34 * sc, 3.6 * sc, 4 * sc, 0, 0, TAU);
    const bas = new Path2D(); bas.moveTo(x - 2 * sc, yb - 34 * sc); bas.lineTo(x + 12 * sc, yb - 36 * sc); bas.lineTo(x + 6 * sc, yb - 10 * sc); bas.closePath();
    put(bas, C(.34, .22, .1, .24, .08));
    put(body, [C(.2, .52, 0, .04, 0), C(.52, .24, 0, 0, 0), C(.1, .1, .1, .4, .1), C(.44, .44, 0, 0, 0)][k % 4]);
    put(head, C(.3, .3, 0, .3, .2));
  });
  // shade trees across the garden at three depths; the nearest pass fast
  for (const [p, n, cov, sm_] of [[.28, 5, C(.08, .2, .28, .36, .12), 0], [.55, 4, C(.06, .18, .34, .44, .18), 0], [1.1, 3, C(.04, .14, .38, .52, .28), 1]]) {
    const tr = new Path2D();
    visit('pp:tst' + p, Math.max(1, Math.round(D * p / (p > 1 ? 1500 : 620))), D, s, p, 260 * p, (k, x) => shadeTree(tr, x, gy(hy, GK, p) + 2, p, 's' + p + k));
    if (sm_) { const m = mask(1); smear(m, P.V * p / 30 * .5, g => g.fill(tr)); putM(m, cov); }
    else put(tr, cov);
  }
  flock(tl, 'egret1', 14, 44, -80, W + 260, hy - 230, 6, 6, C(0, .06, 0, .1, 0), { knockW: 4.2, w: 1, hz: 1.6 });
  masts(s, D, P.V, C(.1, .22, .02, .3, .2), { edge: .5 });
}

/* ── Passage 2: the Brahmaputra in the morning ──────────────────────────── */
function viewRiver(tl, P) {
  const hy = P.hy, s = P.V * tl, D = P.V * L, GK = 150;
  put(rect(0, 0, W, hy + 30), skyC(hy, [0, 90, 250, 450], [C(.12, .06, 0, .06, 0), C(.04, .03, 0, .14, 0), C(0, .02, 0, .26, .03), C(0, .02, 0, .34, .06)]));
  cumulus(tl, hy, { n: 6, scale: .45, key: 'rcu', lift: 60 });
  // the far bank: pale hills, then a dark tree line
  const f1 = sridge('pp:rf1', [[800, 14], [300, 6], [100, 2]]);
  const hA = x => 96 + f1(x) * 2 + 60 * Math.exp(-(((x - 300) / 220) ** 2)) + 30 * Math.exp(-(((x - 850) / 160) ** 2));
  const f2 = sridge('pp:rf2', [[500, 10], [180, 5], [60, 2]]), hB = x => 50 + f2(x) + 20 * Math.exp(-(((x - 620) / 160) ** 2));
  put(skylinePath(hA, hy, hy + 20), C(.02, .14, 0, .22, .06));
  strokeKnock(skylineStroke(hA, hy, 1), 1.6, .5);
  put(skylinePath(hB, hy, hy + 20), C(.08, .1, .12, .3, .12));
  strokeCov(skylineStroke(hB, hy, 1), 2, C(.3, .1, 0, 0, 0));
  const tl1 = pridge('pp:rtl', D, [[30, 1], [70, .5], [150, .3], [300, .2]]);
  const pT = .045, tlFn = x => { const X = s + (x - 540) / pT; return 9 + 5 * tl1(X) + 3 * Math.pow(Math.abs(Math.sin(X * TAU * 400 / D)), .5); };
  put(skylinePath(tlFn, hy, hy + 6), C(.14, .06, .4, .3, .1));
  // water: sky reflected, darker toward us, horizontal glints world-anchored
  put(rect(0, hy + 4, W, 220), rampC([hy + 4, hy + 60, hy + 220], [C(.04, .03, .02, .2, .03), C(.06, .04, .02, .24, .04), C(.04, .03, .06, .36, .12)]));
  // the hills mirrored, broken by ripple rows
  const refl = new Path2D(); refl.moveTo(-20, hy + 4);
  for (let x = -20; x <= W + 20; x += 4) refl.lineTo(x, hy + 6 + hA(x) * .42 + 1.5 * Math.sin(x * .09 + lw(3) * tl));
  refl.lineTo(W + 20, hy + 4); refl.closePath();
  add(refl, C(.02, .08, 0, .12, .04));
  const refl2 = new Path2D(); refl2.moveTo(-20, hy + 4);
  for (let x = -20; x <= W + 20; x += 4) refl2.lineTo(x, hy + 6 + hB(x) * .42 + 1.5 * Math.sin(x * .11 + lw(4) * tl));
  refl2.lineTo(W + 20, hy + 4); refl2.closePath();
  add(refl2, C(.04, .04, .06, .12, .05));
  const gl = new Path2D();
  for (let r = 0; r < 40; r++) {
    const y = hy + 8 + r * r * .12 + r * 1.5, p = (y - hy) / GK;
    if (y > hy + 200) break;
    visit('pp:gl' + r, 8, D, s, Math.max(p, .02), 60, (k, x) => { const w = (20 + h01('gw' + r + k) * 60) * p + 4; gl.moveTo(x - w, y); gl.lineTo(x + w, y); });
  }
  strokeKnock(gl, 1.6, .7);
  // sandbars (chars) lying low on the water, grass on their backs
  for (const [p, n] of [[.08, 5], [.14, 4], [.3, 2]]) visit('pp:char' + p, n, D, s, p, 1600 * p, (k, x) => {
    const y = gy(hy, GK, p), w = (1600 + h01('cw' + k) * 2200) * p, h = 9 * p + 3;
    const bar = cut([[x - w, y], [x - w * .6, y - h], [x + w * .5, y - h * 1.2], [x + w, y], [x + w * .3, y + h * .5], [x - w * .5, y + h * .4]], rngFor('ch' + p + k), { amp: 1.5 });
    put(bar, C(.36, .16, 0, .06, 0)); strokeCov(pline([[x - w * .8, y - h * .9], [x + w * .6, y - h]]), 1.6, C(.5, .2, 0, 0, 0));
    const gr = cut([[x - w * .5, y - h * .8], [x, y - h * 2.2], [x + w * .4, y - h * 1.1], [x + w * .2, y - h * .6]], rngFor('cg' + p + k), { amp: 1.4 });
    put(gr, C(.3, .04, .34, .1, 0));
    strokeKnock(pline([[x - w * .9, y + h * .45], [x + w * .8, y + h * .45]]), 1.4, .8);
  });
  // country boats: one poled along the far water, one moored with a sail
  boats(tl, s, D, hy, GK);
  // near bank: kash grass in white plume and bamboo clumps
  const nb = pridge('pp:rnb', D, [[60, 1], [140, .5], [320, .3]]);
  const nbFn = x => -168 + 10 * nb(s + (x - 540) / .9);
  put(skylinePath(nbFn, hy, W + 20), rampC([hy + 150, A[3]], [C(.24, .06, .5, .3, .1), C(.16, .06, .56, .42, .2)]));
  strokeCov(skylineStroke(nbFn, hy, 1), 3, C(.42, .06, .16, 0, 0));
  bamboo(s, D, hy + 190, .8, P.V);
  kash(s, D, hy + 205, 1.1, P.V, tl);
  flock(tl, 'egret2', 20, 50, W + 60, -300, hy - 150, 7, 5, C(0, .05, 0, .1, 0), { knockW: 3.6, w: 1, hz: 1.7 });
  masts(s, D, P.V, C(.14, .16, .02, .3, .22), { edge: .5 });
}
function boats(tl, s, D, hy, GK) {
  for (const [p, key, drift, sail] of [[.16, 'b1', 38, false], [.3, 'b2', 0, true]]) {
    (drift ? (f => visitMid('pp:boat' + key, D, s, p, f)) : (f => visit('pp:boat' + key, 1, D, s, p, 300, f)))((k, x0) => {
      const x = x0 + drift * p * (tl - L / 2), y = gy(hy, GK, p), sc = p * 2.2, bob = Math.sin(lw(11) * tl + k) * sc;
      const hull = new Path2D(); hull.moveTo(x - 60 * sc, y - 9 * sc + bob); hull.quadraticCurveTo(x, y + 4 * sc + bob, x + 60 * sc, y - 11 * sc + bob); hull.lineTo(x + 50 * sc, y - 5 * sc + bob); hull.quadraticCurveTo(x, y + 1 * sc + bob, x - 52 * sc, y - 4 * sc + bob); hull.closePath();
      const hood = new Path2D(); hood.moveTo(x - 18 * sc, y - 6 * sc + bob); hood.quadraticCurveTo(x, y - 26 * sc + bob, x + 20 * sc, y - 6 * sc + bob); hood.closePath();
      put(hood, C(.36, .2, .04, .16, .04));
      put(hull, C(.1, .2, .02, .36, .3));
      // reflection
      const rf = new Path2D(); rf.moveTo(x - 50 * sc, y + 2 * sc + bob); rf.lineTo(x + 50 * sc, y + 2 * sc + bob); rf.lineTo(x + 40 * sc, y + 9 * sc); rf.lineTo(x - 40 * sc, y + 9 * sc); rf.closePath();
      add(rf, C(0, .06, 0, .14, .1));
      if (!sail) {                                   // boatman with his pole
        const lean = Math.sin(lw(6) * tl) * .15;
        const man = new Path2D(); man.addPath(nib([[x + 36 * sc, y - 10 * sc + bob], [x + 34 * sc + lean * 10 * sc, y - 30 * sc + bob]], u => 2.6 * sc, { per: 3 }));
        man.ellipse(x + 34 * sc + lean * 10 * sc, y - 34 * sc + bob, 2.6 * sc, 3 * sc, 0, 0, TAU);
        man.addPath(nib([[x + 50 * sc, y + 14 * sc], [x + 26 * sc + lean * 20 * sc, y - 44 * sc + bob]], u => .9 * sc, { per: 2 }));
        put(man, C(.1, .16, 0, .4, .3));
      } else {
        const sl = new Path2D(); sl.moveTo(x - 4 * sc, y - 8 * sc + bob); sl.lineTo(x - 4 * sc, y - 70 * sc + bob); sl.lineTo(x + 34 * sc, y - 62 * sc + bob); sl.lineTo(x + 30 * sc, y - 12 * sc + bob); sl.closePath();
        put(sl, C(.34, .12, 0, .04, 0));
        strokeCov(pline([[x - 4 * sc, y - 4 * sc + bob], [x - 4 * sc, y - 74 * sc + bob]]), 1.4 * sc, C(0, .1, 0, .4, .3));
      }
    });
  }
}
function bamboo(s, D, yb, p, V) {
  const path = new Path2D();
  visit('pp:bam', Math.round(D * p / 900), D, s, p, 300, (k, x) => {
    const r = rngFor('pp:bm' + k), n = 9 + Math.floor(r() * 6);
    for (let i = 0; i < n; i++) {
      const a = (i / (n - 1) - .5) * 1.4 + (r() - .5) * .2, len = (180 + r() * 120) * p, bend = a * 1.4;
      const pts = [[x + (r() - .5) * 20 * p, yb], [x + Math.sin(a) * len * .5, yb - Math.cos(a) * len * .5], [x + Math.sin(bend) * len, yb - Math.cos(bend) * len * .8]];
      path.addPath(nib(pts, u => (4 - 3 * u) * p, { per: 6 }));
      const tip = pts[2];
      for (let j = 0; j < 5; j++) { const lx = tip[0] - Math.sin(bend) * j * 14 * p, ly = tip[1] + Math.cos(bend) * j * 12 * p; path.addPath(nib([[lx, ly], [lx + (8 + r() * 12) * p * Math.sign(a || 1), ly + 10 * p]], wLeaf(2.4 * p), { per: 4 })); }
    }
  });
  const m = mask(1); smear(m, V * p / 30 * .5, g => g.fill(path)); putM(m, C(.24, .06, .56, .36, .12));
}
function kash(s, D, yb, p, V, tl) {
  const stems = new Path2D(), plumes = new Path2D();
  visit('pp:kash', Math.round(D * p / 26), D, s, p, 80, (k, x) => {
    const h = (60 + h01('kh' + k) * 110) * p, sway = Math.sin(lw(13) * tl + k * .7) * 7 * p, tx = x + sway + (h01('kl' + k) - .5) * 30 * p;
    stems.addPath(nib([[x, yb + 40], [lerp(x, tx, .5), yb - h * .5], [tx, yb - h]], u => 1.3 * p, { per: 3 }));
    const bend = .5 + h01('kb' + k) * .6, len = (26 + h01('kz' + k) * 20) * p;
    for (let j = 0; j < 5; j++) {                    // a plume is many silky strands
      const a = -Math.PI / 2 + (j / 4 - .5) * .5 + bend * .4, ex = tx + Math.cos(a) * len + sway * .5, ey = yb - h + Math.sin(a) * len;
      plumes.addPath(nib([[tx, yb - h + 4 * p], [lerp(tx, ex, .5) + 3 * p, lerp(yb - h, ey, .5)], [ex, ey]], wSwell(2.6 * p, .55, .4), { per: 5 }));
    }
  });
  const d = V * p / 30 * .5;
  const m = mask(1); smear(m, d, g => g.fill(stems)); putM(m, C(.34, .08, .36, .18, .06));
  const m2 = mask(2); smear(m2, d, g => g.fill(plumes));
  const c = m2.canvas;
  for (const n of PL) { const g = PG[n]; g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'destination-out'; g.globalAlpha = .85; g.drawImage(c, 0, 0); if (n === 'pink' || n === 'yellow') { g.globalCompositeOperation = 'lighter'; g.globalAlpha = .08; g.drawImage(c, 0, 0); } g.restore(); }
}

/* ── Passage 3: the plains at noon ──────────────────────────────────────── */
function viewNoon(tl, P) {
  const hy = P.hy, s = P.V * tl, D = P.V * L, GK = 110;
  put(rect(0, 0, W, hy + 30), skyC(hy, [0, 80, 240, 440], [C(.06, .02, 0, .08, 0), C(0, 0, 0, .2, .02), C(0, 0, 0, .36, .06), C(0, .02, 0, .46, .12)]));
  cumulus(tl, hy);
  // horizon trees and a village with a temple (p = .09)
  const tlf = pridge('pp:ntl', D, [[25, 1], [60, .6], [140, .3], [320, .2]]);
  const pT = .05, tlFn = x => { const X = s + (x - 540) / pT; return 12 + 6 * tlf(X) + 4 * Math.pow(Math.abs(Math.sin(X * TAU * 500 / D)), .5); };
  put(skylinePath(tlFn, hy, hy + 6), C(.12, .06, .36, .28, .08));
  village(tl, s, D, hy, GK);
  // paddies: a grid on the ground plane; young green, flooded, ripening
  paddies(s, D, hy, GK, tl);
  // palms: toddy and coconut at several depths
  for (const [p, n] of [[.3, 6], [.6, 4], [1.15, 2]]) {
    const path = new Path2D();
    visit('pp:palm' + p, Math.max(1, Math.round(D * p / 1100)), D, s, p, 300 * p, (k, x) => palm(path, x, gy(hy, GK, p) + 2, p, 'n' + p + k, tl));
    const cov = mixC(C(.18, .06, .44, .34, .12), C(.1, .06, .56, .5, .26), clamp(p, 0, 1));
    if (p > 1) { const m = mask(1); smear(m, P.V * p / 30 * .5, g => g.fill(path)); putM(m, cov); } else put(path, cov);
  }
  // a man with an umbrella walking the bund (p = .35), crossing once per loop
  visitMid('pp:umb', D, s, .35, (k, x0) => {
    const x = x0 + 24 * .35 * (tl - 30), yb = gy(hy, GK, .35) - 1, sc = .35 * 1.6, step = Math.sin(lw(70) * tl) * 2 * sc;
    const b = new Path2D(); b.addPath(nib([[x, yb - 26 * sc], [x, yb - 8 * sc]], u => 3 * sc, { per: 2 }));
    b.addPath(nib([[x, yb - 9 * sc], [x - 3 * sc + step, yb]], u => 1.4 * sc, { per: 2 })); b.addPath(nib([[x, yb - 9 * sc], [x + 3 * sc - step, yb]], u => 1.4 * sc, { per: 2 }));
    put(b, C(.08, .08, 0, .34, .24));
    const u = new Path2D(); u.moveTo(x - 14 * sc, yb - 32 * sc); u.quadraticCurveTo(x, yb - 46 * sc, x + 14 * sc, yb - 32 * sc); u.closePath();
    put(u, C(0, .1, 0, .46, .4));
  });
  flock(tl, 'kite', 8, 58, W + 100, -200, 260, 1, 12, C(.04, .1, 0, .36, .3), { hz: .5, w: 3.2 });
  masts(s, D, P.V, C(.14, .14, .02, .3, .22), { edge: .55, spacing: 1500 });
}
function cumulus(tl, hy, o = {}) {
  const Pc = 2600, off = fract(tl / L) * Pc, r = rngFor('pp:' + (o.key || 'cu')), sc = o.scale || 1;
  for (let i = 0; i < (o.n || 4); i++) {
    const cx = r() * Pc, w = (110 + r() * 110) * sc, h = (70 + r() * 80) * sc, yb = hy - 150 - r() * 70 - (o.lift || 0) * r();
    for (const m of [-1, 0, 1]) {
      const x = ((cx - off) % Pc + Pc) % Pc - 600 + m * Pc;
      if (x + w * 1.6 < 0 || x - w * 1.6 > W) continue;
      const pts = [[x - w * 1.4, yb], [x - w * 1.1, yb - h * .35], [x - w * .6, yb - h * .6], [x - w * .3, yb - h], [x + w * .2, yb - h * .9], [x + w * .5, yb - h * .6], [x + w * .9, yb - h * .45], [x + w * 1.4, yb]];
      const cl = cut(pts, rngFor((o.key || 'cu') + i), { amp: 6 * sc });
      knock(cl, KALL(1));
      const belly = new Path2D(); belly.rect(x - w * 1.5, yb - h * .28, w * 3, h * .3);
      withClip(cl, () => { add(belly, C(0, .02, 0, .14, .04)); });
      strokeCov(pline([[x - w * 1.35, yb], [x + w * 1.35, yb]]), 2, C(0, .03, 0, .2, .06));
    }
  }
}
function village(tl, s, D, hy, GK) {
  const p = .09;
  visit('pp:vil', 1, D, s, p, 500, (k, x) => {
    const yb = hy + 3, huts = new Path2D(), roofs = new Path2D();
    for (let i = 0; i < 9; i++) {
      const hx = x - 260 * p * 3 + i * 60 * p * 3 + h01('vh' + i) * 20, w = 22 + h01('vw' + i) * 16, h = 12 + h01('vt' + i) * 6;
      huts.rect(hx - w / 2, yb - h, w, h);
      roofs.moveTo(hx - w / 2 - 3, yb - h); roofs.lineTo(hx, yb - h - 10); roofs.lineTo(hx + w / 2 + 3, yb - h); roofs.closePath();
    }
    put(huts, C(.34, .14, 0, .08, 0));

    const c = m.canvas; for (const n of ['green', 'blue', 'indigo']) { const g = PG[n]; g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = n === 'green' ? .5 : .3; g.drawImage(c, 0, 0); g.restore(); }

/* ── covered switches ─────────────────────────────────────────────────────────
   Passage A keeps running from its loop start (tl = u); passage B arrives at
   its loop start (tl = u − TR, wrapped). The place, hour and light change only
   while the cover fills the window, so both seams are exact and the switch
   itself is never seen. Each cover has an entry edge and an exit edge that
   sweep right→left (everything outside moves left). */
let SHAKE = 0;                                    // extra slosh while a train blasts past

const TRX = {
  express:      { t0: 2.2, t1: 9.6, v: 1500, sw: 6.0 },
  goods:        { t0: 2.0, t1: 10.0, v: 1100, sw: null },
  tunnel:       { t0: 2.6, t1: 9.0, v: 900, sw: 5.8 },
  nightExpress: { t0: 2.2, t1: 9.6, v: 1500, sw: 6.0 },
};
/* Screen x of the cover's leading (left) and trailing (right) edges at u. */
function coverEdges(T, u) {
  const lead = W + 40 - T.v * (u - T.t0), len = T.v * (T.t1 - T.t0) - (W + 80);
  return { lead, trail: lead + len + W + 80, len: len + W + 80 };
}
/* Goods train: switch while no coupling gap is on screen. */
const GOODS = { wl: 1620, gap: 70 };
function goodsSwitch() {
  const T = TRX.goods;
  for (let u = 5.8; u < 8; u += 1 / 60) {
    const { lead } = coverEdges(T, u); let clear = lead < A[0] - 40;
    for (let x = lead + GOODS.wl; x < lead + T.v * (T.t1 - T.t0); x += GOODS.wl + GOODS.gap) if (x + GOODS.gap > A[0] - 30 && x < A[2] + 30) clear = false;
    if (clear) return u;
  }
  return 6;
}
TRX.goods.sw = goodsSwitch();

function transition(seg, u) {
  const T = TRX[seg.type], A_ = PASSES[seg.i], B_ = PASSES[seg.i + 1];
  const tA = u, tB = ((u - TR) % L + L) % L;
  if (u < T.sw) drawView(seg.i, tA); else drawView(seg.i + 1, tB);
  const { lead, trail } = coverEdges(T, u);
  const cover = clamp(Math.min((A[2] - lead) / (A[2] - A[0]), (trail - A[0]) / (A[2] - A[0])), 0, 1);
  SHAKE = seg.type === 'tunnel' ? 0 : cover;
  if (seg.type === 'express') train(u, T, lead, trail, false);

/* A tunnel: the portal's stone ring sweeps in, then darkness with the lining

/* ── the score: the raga of the hour ─────────────────────────────────────────
   Hindustani music keeps time of day, and so does this film. Sa is D; each
   passage takes the colour of a raga of its hour, the same five-note contour
   (the motif) runs through all of them, and a tanpura drone never stops.
   Nothing is looped: each chapter (a passage plus the transition after it) is
   rendered at full length with seeded variation, then chapters are laid end
   to end with their tails overlapping. The rail joints are the picture's own
   knocks (0.6 s pairs), so sound and shake share one clock.               */
const SA = 62;                                               // D4
const RAGAS = {
  tea:   { name: 'Bhairav',  scale: [0, 1, 4, 5, 7, 8, 11], vadi: 8,  lead: 'flute',   amb: 'birds' },
  river: { name: 'Bilawal',  scale: [0, 2, 4, 5, 7, 9, 11], vadi: 9,  lead: 'santoor', amb: 'water' },
  noon:  { name: 'Sarang',   scale: [0, 2, 5, 7, 10],       vadi: 2,  lead: 'flute',   amb: 'cicada' },
  ghats: { name: 'Desh',     scale: [0, 2, 5, 7, 11, 10, 9],vadi: 2,  lead: 'flute',   amb: 'rain' },
  dusk:  { name: 'Yaman',    scale: [0, 2, 4, 6, 7, 9, 11], vadi: 4,  lead: 'santoor', amb: 'bell' },
  night: { name: 'Malkauns', scale: [0, 3, 5, 8, 10],       vadi: 5,  lead: 'flute',   amb: 'crickets' },
};
const MOTIF = [0, 1, 2, 4, 2, 1, 0];                         // steps through each raga's scale
const deg = (R, d) => { const n = R.scale.length, o = Math.floor(d / n); return SA + 12 * o + R.scale[((d % n) + n) % n]; };

  dusk:   { gain: 1.0,  tint: C(.16, .14, 0, 0, 0),     spill: C(.4, .26, 0, 0, 0), spillA: .45 },
  night:  { gain: 1.35, tint: C(0, .03, 0, .34, .30),   spill: C(0, 0, 0, .1, .05), spillA: .0 },
};
const PASSES = [
  { id: 'tea',   name: 'Tea garden dawn, Assam',        loops: 3, V: 560, hy: 590, theme: 'dawn',  chai: .92, steam: 1,   view: (tl, P) => viewTea(tl, P) },
  { id: 'river', name: 'Brahmaputra morning',           loops: 3, V: 700, hy: 530, theme: 'morn',  chai: .8,  steam: .55, view: (tl, P) => viewRiver(tl, P) },
  { id: 'noon',  name: 'Plains at noon',                loops: 4, V: 820, hy: 540, theme: 'noon',  chai: .66, steam: 0,   view: (tl, P) => viewNoon(tl, P) },
  { id: 'ghats', name: 'Western Ghats in the rain',     loops: 3, V: 480, hy: 540, theme: 'rain',  chai: .52, steam: 0,   view: (tl, P) => viewGhats(tl, P) },
  { id: 'dusk',  name: 'Deccan sunset near Pune',       loops: 3, V: 640, hy: 575, theme: 'dusk',  chai: .36, steam: 0,   view: (tl, P) => viewDusk(tl, P) },
  { id: 'night', name: 'Night and stars',               loops: 3, V: 600, hy: 600, theme: 'night', chai: .08, steam: 0,   view: (tl, P) => viewNight(tl, P) },
];
const TRANS = ['express', 'goods', 'tunnel', 'tunnel', 'nightExpress'];
const PROG = (() => {
  const out = []; let t = 0;
  PASSES.forEach((P, i) => {
    out.push({ kind: 'pass', i, start: t, end: t + P.loops * L }); t += P.loops * L;
    if (i < TRANS.length) { out.push({ kind: 'tr', i, type: TRANS[i], start: t, end: t + TR }); t += TR; }
  });
  return out;
})();
const PROG_END = PROG[PROG.length - 1].end;          // 1200

function segAt(T) {
  for (const s of PROG) if (T < s.end) return s;
  return PROG[PROG.length - 1];
}
function drawView(i, tl) {
  const P = PASSES[i], jy = 0.9 * knockAt(tl) - 0.4;
  setAll(1, 0, 0, 1, 0, jy);
  P.view(tl, P);
  setAll(1, 0, 0, 1, 0, 0);
}
function drawArt(T) {
  resetPlates();
  const seg = segAt(T);
  if (seg.kind === 'pass') {
    const P = PASSES[seg.i], tl = (T - seg.start) % L;
    drawView(seg.i, tl);
    interior(tl, THEMES[P.theme], P.chai, P.steam);
  } else {
    transition(seg, T - seg.start);
  }
  compose();
}
const SHOTS = PROG.map(s => s.kind === 'pass'
  ? { id: PASSES[s.i].id, start: s.start, end: s.end, readAt: s.start + 20, action: PASSES[s.i].name + ` (${PASSES[s.i].loops} × ${L}s loop)`, transition: 'loop' }
  : { id: 'tr-' + s.type + '-' + s.i, start: s.start, end: s.end, readAt: s.start + TR / 2, action: 'covered switch: ' + s.type, transition: s.type });


// ART END

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
canvas.width=canvas.height=OUT;
paper=bakePaper();
const scrub=document.getElementById('scrub'),clockLabel=document.getElementById('time');
function render(t) {
  t=clamp(t,0,DUR); ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.drawImage(paper,0,0);drawArt(t);scrub.value=t;clockLabel.value=t.toFixed(2);
}
function paintBaked(id) {
  ctx.save();ctx.globalCompositeOperation='multiply';ctx.drawImage(bakeScene(id,OUT),0,0);ctx.restore();
}
/* A frame slower than the frame interval cannot play live (live-plate films take
   100-200 ms): Play then renders every frame once into a WebP cache, shown as
   "Buffering n%", and plays from it at FPS; replays are immediate. Fast films play
   live. seek() and window.__riso stay live and pure; tools never touch the cache. */
const FPS=30,NF=Math.round(DUR*FPS),cache=[],bitmaps=new Map(),playBtn=document.getElementById('play');
let at=0,playing=false,epoch=0,recorder=null,recordURL=null,slow=null,buffering=false,filled=0;
function label(){playBtn.textContent=playing?'Pause':buffering?'Buffering '+Math.round(filled/(NF+1)*100)+'%':'Play';}
function start(){if(at>=DUR)at=0;epoch=performance.now()-at*1000;playing=true;label();}
function pause(){if(playing)at=clamp((performance.now()-epoch)/1000,0,DUR);playing=false;buffering=false;label();if(recorder?.state==='recording')recorder.stop();}
async function buffer(){
  buffering=true;label();const resume=at;
  for(let i=0;i<=NF&&buffering;i++){
    if(cache[i])continue;
    render(i/FPS);canvas.toBlob(b=>{cache[i]=b;filled++;},'image/webp',0.8);   // snapshots now, encodes alongside the next draw
    label();await new Promise(r=>setTimeout(r,0));
  }
  while(buffering&&filled<NF+1)await new Promise(r=>setTimeout(r,50));
  if(buffering){buffering=false;at=resume;start();}
}
function play(){
  if(at>=DUR)at=0;
  if(slow===null){const t0=performance.now();render(at);render(at);slow=(performance.now()-t0)/2>900/FPS;}
  start();   // 20 minutes cannot be pre-buffered: play live, dropping frames if slow; the MP4 is the full-rate film
}
function seek(t){pause();at=clamp(t,0,DUR);render(at);}
playBtn.onclick=()=>playing||buffering?pause():play();
document.getElementById('replay').onclick=()=>{seek(0);play();};
scrub.oninput=()=>seek(Number(scrub.value));
addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(['Space','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space')playing||buffering?pause():play();if(e.code==='ArrowLeft')seek(at-1/FPS);if(e.code==='ArrowRight')seek(at+1/FPS);});
document.getElementById('record').onclick=()=>{
  if(recorder?.state==='recording'){pause();return;}
  const mime=['video/webm;codecs=vp8','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime)throw Error('No supported recording codec; use tools/render.mjs');
  seek(0);const stream=canvas.captureStream(FPS),chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime});
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(recordURL)URL.revokeObjectURL(recordURL);recordURL=URL.createObjectURL(new Blob(chunks,{type:mime}));const a=document.getElementById('download');a.href=recordURL;a.download='preview.webm';a.style.display='inline';};
  recorder.start();play();
};
function tick(now){
  if(playing){
    at=clamp((now-epoch)/1000,0,DUR);
    if(true)render(at);
    else{
      const i=Math.min(NF,Math.floor(at*FPS));
      for(let j=i;j<Math.min(NF+1,i+8);j++)if(cache[j]&&!bitmaps.has(j)){bitmaps.set(j,null);createImageBitmap(cache[j]).then(b=>bitmaps.set(j,b));}
      for(const [j,b] of bitmaps)if(j<i-1){if(b)b.close();bitmaps.delete(j);}
      const b=bitmaps.get(i);
      if(b){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.drawImage(b,0,0);scrub.value=at;clockLabel.value=at.toFixed(2);}
    }
    if(at>=DUR)pause();
  }
  requestAnimationFrame(tick);
}
window.__riso={duration:DUR,ready:false,seek,shots:SHOTS};
{const sel=document.getElementById('chap');for(const sh of SHOTS){const o=document.createElement('option');o.value=sh.start;o.textContent=(sh.transition==='loop'?'':'· ')+sh.action.replace(/ \(.*$/,'');sel.appendChild(o);}sel.onchange=()=>seek(Number(sel.value));}
for(const id of Object.keys(SCENES))bakeScene(id,OUT);
seek(Number(new URLSearchParams(location.search).get('t'))||0);
requestAnimationFrame(tick);
window.__riso.ready=true;
</script></html>
